<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="LeadVault — Manage your leads and outreach from your phone">
  <title>LeadVault</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ═══ Home View ════════════════════════════ -->
  <section id="home-view" class="view active">
    <div class="home-header">
      <div>
        <div class="home-greeting" id="home-greeting">Good afternoon</div>
        <h1 class="home-title">Lead<span class="accent">Vault</span></h1>
      </div>
      <span class="home-badge" id="home-badge">0 leads</span>
    </div>

    <div class="home-scroll">
      <!-- Stats Cards -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card sc-indigo">
          <div class="stat-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          </div>
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">Total Leads</div>
        </div>
        <div class="stat-card sc-emerald">
          <div class="stat-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
          </div>
          <div class="stat-value" id="stat-called">0</div>
          <div class="stat-label">Called</div>
        </div>
        <div class="stat-card sc-amber">
          <div class="stat-icon">⭐</div>
          <div class="stat-value" id="stat-interested">0</div>
          <div class="stat-label">Interested</div>
        </div>
        <div class="stat-card sc-green">
          <div class="stat-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          </div>
          <div class="stat-value" id="stat-wa">0</div>
          <div class="stat-label">WhatsApp Sent</div>
        </div>
      </div>

      <!-- Progress -->
      <div class="home-progress" id="home-progress"></div>

      <!-- Status Categories -->
      <div class="home-section">
        <div class="home-section-title">By Status</div>
        <div class="cat-list" id="status-cats"></div>
      </div>

      <!-- Segment Categories -->
      <div class="home-section">
        <div class="home-section-title">By Category</div>
        <div class="cat-list" id="segment-cats"></div>
      </div>

      <!-- Timeline -->
      <div class="home-section">
        <div class="home-section-title">Timeline</div>
        <div class="cat-list" id="timeline-cats"></div>
      </div>

      <!-- Upload zone (shown when no leads) -->
      <div class="home-upload" id="home-upload" style="display:none">
        <div class="upload-zone" id="upload-zone">
          <div class="upload-zone-inner">
            <div class="upload-icon">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <h2>Import your leads</h2>
            <p>Drop a CSV or Excel file, or tap to browse</p>
          </div>
        </div>
        <input type="file" id="file-input" accept=".csv,.xlsx,.xls" hidden>
      </div>
    </div>
  </section>

  <!-- ═══ Leads View ═══════════════════════════ -->
  <section id="leads-view" class="view">
    <div class="leads-header">
      <button class="back-btn" id="leads-back" title="Back to Home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="leads-title-box">
        <h2 class="leads-title" id="leads-title">All Leads</h2>
        <span class="leads-filter-pill" id="leads-filter-pill" style="display:none"></span>
      </div>
      <span class="leads-count" id="leads-count">0</span>
    </div>
    <div class="leads-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Search by name, phone, area, segment..." autocomplete="off">
      <button class="search-clear-btn" id="search-clear-btn" style="display:none" title="Clear search">✕</button>
    </div>
    <!-- Quick filter chips -->
    <div class="quick-chips-bar" id="quick-chips-bar">
      <button class="chip active" data-chip="all">All</button>
      <button class="chip" data-chip="today">Today</button>
      <button class="chip" data-chip="yesterday">Yesterday</button>
      <button class="chip" data-chip="not-called">Not Called</button>
      <button class="chip" data-chip="called">Called</button>
      <button class="chip" data-chip="interested">Interested</button>
      <button class="chip" data-chip="messaged">Messaged</button>
    </div>
    <div class="leads-scroll" id="leads-list"></div>
  </section>

  <!-- ═══ More/Settings View ═══════════════════ -->
  <section id="more-view" class="view">
    <div class="more-header">
      <h2>Settings & Data</h2>
    </div>
    <div class="more-scroll">
      <div class="settings-group">
        <div class="settings-group-title">Data Management</div>
        <div class="settings-group-items">
          <button class="settings-item" id="btn-upload-more">
            <div class="si-icon si-accent">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <div class="si-text"><div class="si-title">Import leads</div><div class="si-desc">Upload CSV or Excel file</div></div>
            <svg class="si-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="settings-item" id="btn-reload-default">
            <div class="si-icon si-blue">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 11-.57-8.38l5.67-5.67"/></svg>
            </div>
            <div class="si-text"><div class="si-title">Reload verified Kampala leads</div><div class="si-desc">Reset to 117 curated businesses</div></div>
            <svg class="si-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="settings-item" id="btn-export">
            <div class="si-icon si-green">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </div>
            <div class="si-text"><div class="si-title">Export leads CSV</div><div class="si-desc">Download updated call notes & statuses</div></div>
            <svg class="si-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="settings-item si-danger" id="btn-clear-all">
            <div class="si-icon si-red">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
            </div>
            <div class="si-text"><div class="si-title">Clear all leads</div><div class="si-desc">Remove all leads from device</div></div>
            <svg class="si-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
      <div class="settings-group">
        <div class="settings-group-title">About</div>
        <div class="settings-group-items">
          <div class="settings-item si-static">
            <div class="si-icon si-muted">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            </div>
            <div class="si-text"><div class="si-title">LeadVault PWA</div><div class="si-desc">Version 2.0 • Offline Ready • Uganda Outreach</div></div>
          </div>
        </div>
      </div>
      <input type="file" id="file-input-more" accept=".csv,.xlsx,.xls" hidden>
    </div>
  </section>

  <!-- ═══ Bottom Tab Bar ═══════════════════════ -->
  <nav id="tab-bar">
    <button class="tab active" data-tab="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-tab="leads">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      <span>Leads</span>
    </button>
    <button class="tab" data-tab="more">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      <span>More</span>
    </button>
  </nav>

  <div id="toast-container"></div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
