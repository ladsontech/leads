<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="LeadVault — Manage your leads and outreach from your phone. PWA that works offline.">
  <title>LeadVault</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ═══ Header ═══════════════════════════════ -->
  <header id="app-header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
        </div>
        <h1>Lead<span class="accent">Vault</span></h1>
      </div>
      <div class="header-right">
        <span class="lead-count" id="lead-count">0 leads</span>
      </div>
    </div>
    <div class="search-bar" id="search-bar">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search leads..." autocomplete="off">
      </div>
    </div>
  </header>

  <!-- ═══ Main Content ═════════════════════════ -->
  <main id="app-main">

    <!-- Upload View (shown when no leads) -->
    <section id="upload-section" class="view active">
      <div class="upload-zone" id="upload-zone">
        <div class="upload-zone-inner">
          <div class="upload-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <h2>Import your leads</h2>
          <p>Drop a CSV or Excel file here, or tap to browse</p>
          <p class="upload-hint">Supports .csv, .xlsx, and .xls files</p>
        </div>
      </div>
      <input type="file" id="file-input" accept=".csv,.xlsx,.xls" hidden>
      <div class="upload-info">
        <p>Your data stays on this device. <strong>Nothing is uploaded to any server.</strong></p>
      </div>
    </section>

    <!-- Leads View (time-grouped list) -->
    <section id="leads-view" class="view">
      <div id="leads-list"></div>
    </section>

    <!-- Categories View -->
    <section id="categories-view" class="view">
      <div id="categories-list"></div>
    </section>

    <!-- Settings View -->
    <section id="settings-view" class="view">
      <div class="settings-content">

        <div class="settings-group">
          <div class="settings-group-title">Data</div>
          <div class="settings-group-items">
            <button class="settings-item" id="btn-upload-more">
              <div class="settings-item-icon si-accent">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                  <polyline points="17 8 12 3 7 8"/>
                  <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
              </div>
              <div class="settings-item-text">
                <div class="settings-item-title">Import more leads</div>
                <div class="settings-item-desc">Upload CSV or Excel file</div>
              </div>
              <svg class="settings-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <button class="settings-item" id="btn-export">
              <div class="settings-item-icon si-green">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
              </div>
              <div class="settings-item-text">
                <div class="settings-item-title">Export leads</div>
                <div class="settings-item-desc">Download CSV with your call notes</div>
              </div>
              <svg class="settings-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <button class="settings-item si-danger" id="btn-clear-all">
              <div class="settings-item-icon si-red">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                </svg>
              </div>
              <div class="settings-item-text">
                <div class="settings-item-title">Clear all leads</div>
                <div class="settings-item-desc">Remove all data permanently</div>
              </div>
              <svg class="settings-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-group-title">About</div>
          <div class="settings-group-items">
            <div class="settings-item si-static">
              <div class="settings-item-icon si-muted">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="12" y1="16" x2="12" y2="12"/>
                  <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
              </div>
              <div class="settings-item-text">
                <div class="settings-item-title">LeadVault</div>
                <div class="settings-item-desc">Version 2.0 — Progressive Web App</div>
              </div>
            </div>
          </div>
        </div>

      </div>
      <input type="file" id="file-input-more" accept=".csv,.xlsx,.xls" hidden>
    </section>

  </main>

  <!-- ═══ Bottom Tab Bar ═══════════════════════ -->
  <nav id="tab-bar">
    <button class="tab active" data-tab="leads" id="tab-leads">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 00-3-3.87"/>
        <path d="M16 3.13a4 4 0 010 7.75"/>
      </svg>
      <span>Leads</span>
    </button>
    <button class="tab" data-tab="categories" id="tab-categories">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span>Categories</span>
    </button>
    <button class="tab" data-tab="settings" id="tab-settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
        <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
        <line x1="1" y1="14" x2="7" y2="14"/>
        <line x1="9" y1="8" x2="15" y2="8"/>
        <line x1="17" y1="16" x2="23" y2="16"/>
      </svg>
      <span>Settings</span>
    </button>
  </nav>

  <!-- ═══ Toast ════════════════════════════════ -->
  <div id="toast-container"></div>

  <!-- ═══ Scripts ══════════════════════════════ -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
