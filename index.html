<style>
*{-webkit-tap-highlight-color:transparent}
img{max-width:100%}
:root{
  --paper:#ffffff; --raise:#ffffff; --wash:#f6f5f2; --sunk:#efeeea;
  --ink:#111110; --muted:#56554e; --faint:#8b8981;
  --hair:#e4e2dd; --edge:#c8c5be;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --bar:64px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d0d0c; --raise:#151514; --wash:#181817; --sunk:#1f1f1d;
    --ink:#f3f2ee; --muted:#9c9a94; --faint:#76746e;
    --hair:#292825; --edge:#413f3a;
  }
}
:root[data-theme="dark"]{
  --paper:#0d0d0c; --raise:#151514; --wash:#181817; --sunk:#1f1f1d;
  --ink:#f3f2ee; --muted:#9c9a94; --faint:#76746e;
  --hair:#292825; --edge:#413f3a;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
  padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom));
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
button,select,input,textarea{font-family:inherit}
.hold{max-width:720px;margin:0 auto;padding-inline:16px}

/* ── top bar ─────────────────────────────── */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--hair)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:12px 10px}
.title{margin:0;font-size:17px;font-weight:700;letter-spacing:-.015em;flex:1;min-width:0}
.count{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.count b{color:var(--ink);font-weight:500}
.icon-btn{
  flex:none;width:36px;height:36px;display:grid;place-items:center;
  background:transparent;border:1px solid var(--edge);border-radius:9px;
  color:var(--ink);cursor:pointer;
}
.icon-btn:active{background:var(--sunk)}
.icon-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.rule{height:2px;background:var(--hair)}
.rule span{display:block;height:100%;width:0;background:var(--ink);transition:width .35s cubic-bezier(.4,0,.2,1)}
.find{padding-bottom:10px}
.find input{
  width:100%;font-size:15px;color:var(--ink);background:var(--wash);
  border:1px solid transparent;border-radius:10px;padding:10px 12px;
}
.find input::placeholder{color:var(--faint)}
.find input:focus{outline:none;border-color:var(--ink);background:var(--paper)}

/* ── list ────────────────────────────────── */
.rows{padding-bottom:8px}
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:transparent;border:0;border-bottom:1px solid var(--hair);
  padding:14px 0;cursor:pointer;color:inherit;
}
.row:active{background:var(--wash)}
.row:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.dot{flex:none;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--edge)}
.row[data-done="1"] .dot{background:var(--ink);border-color:var(--ink)}
.row[data-warm="1"] .dot{box-shadow:0 0 0 3px var(--sunk)}
.row-mid{flex:1;min-width:0;overflow:hidden}
.row-name{
  display:block;font-size:15.5px;font-weight:600;letter-spacing:-.008em;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row[data-done="1"] .row-name{color:var(--muted)}
.row-sub{
  display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--faint);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row-end{flex:none;display:flex;align-items:center;gap:8px;color:var(--faint)}
.row-tel{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.blank{padding:56px 16px;text-align:center;color:var(--faint);font-size:14px}

/* ── bottom filter bar ───────────────────── */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--paper);border-top:1px solid var(--hair);
  padding-bottom:env(safe-area-inset-bottom);
}
.dock-scroll{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:13px 16px;max-width:720px;margin:0 auto;
}
.dock-scroll::-webkit-scrollbar{display:none}
.pill{
  flex:none;font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;
  text-transform:uppercase;color:var(--muted);background:var(--wash);
  border:1px solid transparent;border-radius:999px;padding:8px 14px;cursor:pointer;
}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pill:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pill i{font-style:normal;opacity:.55;margin-left:6px;font-variant-numeric:tabular-nums}
.dock-div{flex:none;width:1px;background:var(--hair);margin-block:4px}

/* ── sheets ──────────────────────────────── */
dialog{
  position:fixed;inset:auto 0 0 0;margin:0 auto;
  border:0;padding:0;max-width:720px;width:100%;
  background:transparent;max-height:100dvh;
}
dialog::backdrop{background:rgba(0,0,0,.5)}
.sheet{
  background:var(--paper);color:var(--ink);
  border-radius:18px 18px 0 0;border-top:1px solid var(--hair);
  max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:0 16px calc(20px + env(safe-area-inset-bottom));
  animation:rise .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--edge);margin:10px auto 4px}
.sheet-head{position:sticky;top:0;background:var(--paper);padding-top:6px;padding-bottom:12px;z-index:2}
.sheet h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.25;text-wrap:balance}
.sheet-sub{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--faint);margin-top:5px;
}
.sheet-addr{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.sheet-tel{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;
  margin:14px 0 0;letter-spacing:.01em;color:var(--ink);
  background:transparent;border:0;padding:0;cursor:pointer;text-align:left;
}
.sheet-tel:active{opacity:.6}
.sheet-tel:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.copyhint{
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint);
}
.warnline{font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--faint);margin:6px 0 0}
.angle{
  font-size:13.5px;line-height:1.5;color:var(--ink);margin:12px 0 0;
  padding:11px 12px;background:var(--wash);border-radius:10px;
}
.alt{margin:8px 0 0;font-family:var(--mono);font-size:13px}
.alt a{color:var(--ink)}
.alt span{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-left:8px}

.big{display:grid;gap:9px;margin-top:16px}
.big.two{grid-template-columns:1fr 1fr}
.tap{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;border-radius:12px;font-size:15px;font-weight:600;
  text-decoration:none;cursor:pointer;border:1px solid var(--edge);
  background:transparent;color:var(--ink);
}
.tap-solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tap:active{transform:scale(.985)}
.tap:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.block{margin-top:22px}
.cap{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint);margin:0 0 9px;
}
.states{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.state{
  font-size:13px;font-weight:500;padding:11px 10px;border-radius:10px;
  background:var(--wash);border:1px solid transparent;color:var(--muted);cursor:pointer;
}
.state[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.state:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.pad{
  width:100%;font-size:14.5px;line-height:1.5;color:var(--ink);
  background:var(--wash);border:1px solid transparent;border-radius:10px;
  padding:11px 12px;min-height:84px;resize:vertical;
}
.pad:focus{outline:none;border-color:var(--ink);background:var(--paper)}
.pad::placeholder{color:var(--faint)}

.quote{
  font-size:13.5px;line-height:1.55;white-space:pre-wrap;color:var(--muted);
  background:var(--wash);border-radius:10px;padding:12px;
}
details.peek summary{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint);cursor:pointer;list-style:none;padding-block:4px;
}
details.peek summary::-webkit-details-marker{display:none}
details.peek summary::after{content:" \25BE"}
details.peek[open] summary::after{content:" \25B4"}
details.peek .quote{margin-top:9px}

.line{
  width:100%;font-size:15px;color:var(--ink);background:var(--wash);
  border:1px solid transparent;border-radius:10px;padding:11px 12px;
}
.line:focus{outline:none;border-color:var(--ink);background:var(--paper)}
.switch{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ghostbtn{
  width:100%;min-height:46px;border-radius:10px;border:1px solid var(--edge);
  background:transparent;color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;
}
.ghostbtn:active{background:var(--wash)}
.ghostbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tiny{font-size:12.5px;color:var(--faint);line-height:1.5;margin:9px 0 0}
.tiny code{font-family:var(--mono);font-size:11px;background:var(--wash);padding:1px 5px;border-radius:4px}

.note{
  position:fixed;left:50%;bottom:calc(var(--bar) + 18px + env(safe-area-inset-bottom));
  transform:translateX(-50%);background:var(--ink);color:var(--paper);
  font-size:13px;padding:11px 16px;border-radius:10px;z-index:60;
  max-width:calc(100% - 32px);
}
</style>

function shown() {
  const q = find.trim().toLowerCase();
  return leads.filter(l => {
    if (seg !== 'All' && l.s !== seg) return false;
    if (state !== 'All' && rec(l.key).status !== state) return false;
    if (!q) return true;
    return (l.n + ' ' + l.c + ' ' + l.a + ' ' + l.d + ' ' + rec(l.key).notes).toLowerCase().includes(q);
  });
}

function paintCount() {
  const done = leads.filter(l => rec(l.key).status !== 'Not called').length;

  $('count').innerHTML = `<b>${done}</b>/${leads.length}${warm ? ` &middot; <b>${warm}</b> warm` : ''}`;
  $('rule').style.width = (done / leads.length) * 100 + '%';
}

    html += '<span class="dock-div"></span>';
    html += ['All', ...used].map(s =>
      `<button class="pill" type="button" aria-pressed="${s === state}" data-state="${esc(s)}">${esc(s === 'All' ? 'Any' : s)}<i>${s === 'All' ? leads.length : leads.filter(l => rec(l.key).status === s).length}</i></button>`
    ).join('');
  }
  dockEl.innerHTML = html;
}

function paintRows() {
  const list = shown();
  if (!list.length) { rowsEl.innerHTML = '<p class="blank">Nothing here. Try another filter.</p>'; return; }
  rowsEl.innerHTML = list.map(l => {
    const r = rec(l.key);
    return `<button class="row" type="button" data-key="${esc(l.key)}"
        data-done="${r.status !== 'Not called' ? 1 : 0}" data-warm="${WARM.includes(r.status) ? 1 : 0}">
      <span class="dot"></span>
      <span class="row-mid">
        <span class="row-name">${esc(l.n)}</span>
        <span class="row-sub">${esc(l.c)} &middot; ${esc(l.a)}${l.x ? ' &middot; lapsed site' : ''}${r.status !== 'Not called' ? ' &middot; ' + esc(r.status) : ''}</span>
      </span>
      <span class="row-end"><span class="row-tel">${esc(pretty(l.p))}</span>${I_NEXT}</span>
    </button>`;
  }).join('');
}

function paint() { paintCount(); paintDock(); paintRows(); }

/* ── lead sheet ────────────────────────── */
function openLead(key) {
  openKey = key;
  const l = byKey(key), r = rec(key);
  const msg = textFor(l);
  const actions = l.mobile
    ? `<div class="big two">
         <a class="tap tap-solid" href="tel:${telNum(l.p)}">${I_PHONE} Call</a>
         <a class="tap" href="https://wa.me/${waNum(l.p)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${I_WA} WhatsApp</a>
       </div>`
    : `<div class="big"><a class="tap tap-solid" href="tel:${telNum(l.p)}">${I_PHONE} Call</a></div>
       <p class="warnline">Landline. WhatsApp won't reach this number.</p>`;

  leadBody.innerHTML = `
    <div class="grab"></div>
    <div class="sheet-head">
      <h2>${esc(l.n)}</h2>
      <p class="sheet-sub">${esc(l.c)} &middot; ${esc(l.a)}${l.y === 'High' ? ' &middot; ' + l.r + ' reviews' : ''}${l.w ? ' &middot; check site first' : ''}</p>
    </div>
    ${l.d ? `<p class="sheet-addr">${esc(l.d)}</p>` : ''}
    ${l.x ? `<p class="angle">${esc(l.x)}</p>` : ''}
    <button class="sheet-tel" type="button" id="copytel" title="Tap to copy">${esc(pretty(l.p))}<span class="copyhint">tap to copy</span></button>
    ${l.p2 ? `<p class="alt"><a href="tel:${telNum(l.p2)}">${esc(pretty(l.p2))}</a> <span>second line</span></p>` : ''}
    ${l.e ? `<p class="alt"><a href="mailto:${esc(l.e)}">${esc(l.e)}</a> <span>email</span></p>` : ''}
    ${actions}
    ${l.mobile ? `<div class="block"><details class="peek"><summary>The message they'll get</summary><div class="quote">${esc(msg)}</div></details></div>` : ''}
    <div class="block">
      <p class="cap">How did it go</p>
      <div class="states" id="states">
        ${STATES.map(s => `<button class="state" type="button" data-set="${esc(s)}" aria-pressed="${s === r.status}">${s}</button>`).join('')}
      </div>
    </div>
    <div class="block">
      <p class="cap">Notes</p>
      <textarea class="pad" id="pad" placeholder="Who picked up, what they said, when to call back">${esc(r.notes)}</textarea>
    </div>
    <div class="block">
      <a class="tap" href="${mapsUrl(l)}" target="_blank" rel="noopener">${I_PIN} Open in Maps</a>
    </div>
    <div class="block"><button class="ghostbtn" type="button" id="shut">Done</button></div>`;
  leadDlg.showModal();
  leadBody.scrollTop = 0;
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (_) {}
  try {
    const t = document.createElement('textarea');
    t.value = text;
    t.setAttribute('readonly', '');
    t.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(t);
    t.select();
    t.setSelectionRange(0, t.value.length);
    const ok = document.execCommand('copy');
    t.remove();
    return ok;
  } catch (_) { return false; }
}

leadBody.addEventListener('click', async e => {
  if (e.target.closest('#shut')) { leadDlg.close(); return; }
  if (e.target.closest('#copytel')) {
    const l = byKey(openKey);
    const ok = await copyText(telNum(l.p));
    say(ok ? 'Number copied' : telNum(l.p));
    return;
  }
  const b = e.target.closest('[data-set]');
  if (!b) return;
  log[openKey] = { ...rec(openKey), status: b.dataset.set };
  saveCall(openKey);
  leadBody.querySelectorAll('.state').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  paint();
});

let padTimer;
leadBody.addEventListener('input', e => {
  if (!e.target.closest('#pad')) return;
  log[openKey] = { ...rec(openKey), notes: e.target.value };
  writeJSON(K_LOG, log);
  clearTimeout(padTimer);
  padTimer = setTimeout(() => saveCall(openKey), 600);
});
leadDlg.addEventListener('close', () => { openKey = null; paint(); });

/* ── settings sheet ────────────────────── */
const KINDS = [['Plumbing','Plumbers'],['Electrical','Electricians'],['School','Schools'],['Training','Colleges & institutes'],['Consultancy','Firms & consultancies'],['Church','Churches']];
const EG = { Plumbing:['Genius Plumbing Services','Kampala'], Electrical:['Volt Electricians','Kampala'], School:['Kampala High School','Kawempe'],
             Training:['Makerere Business Institute','Makerere'],
             Consultancy:['Uplex & Associates','Nakasero'], Church:['Watoto Church Ntinda','Ntinda'] };
let editKind = 'Plumbing';

function rawText(k, m) {
  const saved = cfg.texts[k + ':' + m];
  return (typeof saved === 'string' && saved.trim()) ? saved : TEXTS[k][m];
}

function openSet() {
  setBody.innerHTML = `
    <div class="grab"></div>
    <div class="sheet-head"><h2>Settings</h2></div>

    <div class="block">
      <p class="cap">Your name</p>
      <input class="line" id="me" type="text" value="${esc(cfg.me)}" autocomplete="name">
    </div>

    <div class="block">
      <p class="cap">Which message</p>
      <div class="switch">
        <button class="state" type="button" data-mode="cold" aria-pressed="${cfg.mode === 'cold'}">First message</button>
        <button class="state" type="button" data-mode="warm" aria-pressed="${cfg.mode === 'warm'}">After a call</button>
      </div>
    </div>

    <div class="block">
      <p class="cap">Wording</p>
      <div class="switch" style="grid-template-columns:1fr 1fr;margin-bottom:9px" id="kinds">
        ${KINDS.map(([k, label]) => `<button class="state" type="button" data-kind="${k}" aria-pressed="${k === editKind}">${label}</button>`).join('')}
      </div>
      <textarea class="pad" id="body" style="min-height:190px">${esc(rawText(editKind, cfg.mode))}</textarea>
      <p class="tiny"><code>{name}</code> becomes the business name and <code>{area}</code> its area. Nothing sends on its own, WhatsApp just opens with this typed in.</p>
    </div>

    <div class="block">
      <p class="cap">Preview</p>
      <div class="quote" id="eg"></div>
    </div>

    <div class="block"><button class="ghostbtn" type="button" id="undo">Put the original wording back</button></div>
    <div class="block"><button class="ghostbtn" type="button" id="csv">Export everything as CSV</button></div>
    <div class="block"><button class="ghostbtn" type="button" id="save" style="background:var(--ink);color:var(--paper);border-color:var(--ink)">Save</button></div>`;
  setDlg.showModal();
  setBody.scrollTop = 0;
  drawEg();
}

function drawEg() {
  const [nm, ar] = EG[editKind];
  $('eg').textContent = $('body').value
    .replace(/\{me\}/g, $('me').value.trim() || 'David')
    .replace(/\{name\}/g, nm).replace(/\{area\}/g, ar);
}

setBody.addEventListener('click', e => {
  const m = e.target.closest('[data-mode]');
  if (m) { cfg.mode = m.dataset.mode; openSet(); return; }
  const k = e.target.closest('[data-kind]');
  if (k) {
    cfg.texts[editKind + ':' + cfg.mode] = $('body').value;
    editKind = k.dataset.kind;
    openSet();
    return;
  }
  if (e.target.closest('#undo')) {
    delete cfg.texts[editKind + ':' + cfg.mode];
    $('body').value = TEXTS[editKind][cfg.mode];
    drawEg();
    return;
  }
  if (e.target.closest('#csv')) { exportCSV(); return; }
  if (e.target.closest('#save')) {
    cfg.me = $('me').value.trim() || 'David';
    const key = editKind + ':' + cfg.mode;
    if ($('body').value.trim() && $('body').value !== TEXTS[editKind][cfg.mode]) cfg.texts[key] = $('body').value;
    else delete cfg.texts[key];
    saveCfg();
    setDlg.close();
    paint();
    say('Saved');
  }
});
setBody.addEventListener('input', e => {
  if (e.target.closest('#body') || e.target.closest('#me')) drawEg();
});
$('open-set').addEventListener('click', openSet);

/* ── export ────────────────────────────── */
function say(msg) {
  const n = document.createElement('div');
  n.className = 'note';
  n.textContent = msg;
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 2400);
}

function exportCSV() {
  const cell = v => /[",\n]/.test(String(v ?? '')) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v ?? '');
  const lines = [['Name','Phone','Line','Segment','Category','Area','Address','Reviews','Priority','Status','Notes'].join(',')];
  leads.forEach(l => {
    const r = rec(l.key);
    lines.push([l.n, telNum(l.p), l.mobile ? 'mobile' : 'landline', l.s, l.c, l.a, l.d, l.r, l.y, r.status, r.notes].map(cell).join(','));
  });
  const data = '﻿' + lines.join('\r\n');
  const filename = 'kampala-calls-' + new Date().toISOString().slice(0, 10) + '.csv';
  try {
    const url = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8;' }));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    say('Exported ' + leads.length + ' leads');
  } catch (_) { say('Could not export on this browser'); }
}

/* ── events ────────────────────────────── */
rowsEl.addEventListener('click', e => {
  const r = e.target.closest('[data-key]');
  if (r) openLead(r.dataset.key);
});
dockEl.addEventListener('click', e => {
  const s = e.target.closest('[data-seg]');
  if (s) { seg = s.dataset.seg; paint(); return; }
  const t = e.target.closest('[data-state]');
  if (t) { state = t.dataset.state; paint(); }
});
$('find').addEventListener('input', e => { find = e.target.value; paintRows(); });

[leadDlg, setDlg].forEach(d => {
  d.addEventListener('click', e => { if (e.target === d) d.close(); });
});

/* ── boot ──────────────────────────────── */
(() => {
  log = readJSON(K_LOG, {});
  const saved = readJSON(K_CFG, null);
  if (saved) cfg = { me: saved.me || 'David', mode: saved.mode === 'warm' ? 'warm' : 'cold', texts: saved.texts || {} };
  paint();
  window.addEventListener('storage', e => {
    if (e.key === K_LOG) { log = readJSON(K_LOG, {}); if (!leadDlg.open && !setDlg.open) paint(); }
    if (e.key === K_CFG) { const c = readJSON(K_CFG, null); if (c) cfg = c; }
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
